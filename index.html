<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebina Shopping Lista - DM Narudžba</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👶 Bebina Shopping Lista</h1>
            <p>DM Online Narudžba - 18.10.2025</p>
        </header>

        <div class="order-info">
            <div class="order-date">Narudžba od 18.10.2025.</div>
            <div class="order-total" id="total-amount">Ukupno: 372,15 KM</div>
        </div>

        <div class="note">
            <strong>💡 Napomena:</strong> Ova lista sadrži proizvode iz vaše DM narudžbe. Kliknite na proizvode za više detalja ili za naručivanje.
        </div>

        <!-- Store sections will be dynamically generated here -->
        <div id="stores-container"></div>

        <footer>
            <p><strong>💝 Srećno sa pripremama!</strong></p>
            <p>DM drogerie markt © 2025</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
